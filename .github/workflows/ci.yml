name: CI

# Aucune permission par défaut : chaque job demande ce qu'il lui faut
permissions: {}

# Exécuté sur les PR, et appelé en réutilisable par deploy.yml avant le build.
# Pas de déclencheur `push` : un push direct sur develop passe déjà par
# deploy.yml, qui appelle ce workflow — une seule source de vérité, pas de double exécution.
on:
  workflow_call:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (types · tests · format · lint · audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      # Le lockfile est rédigé par npm 11.6.4 (packageManager de package.json) ;
      # le npm 10.x bundled de Node 22 le juge désynchronisé. Même épinglage que
      # le job build de deploy.yml.
      - name: Setup npm
        run: npm install --global npm@11.6.4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npx tsc -b

      - name: Tests (vitest run)
        run: npx vitest run

      - name: Format (prettier --check)
        run: npx prettier . --check

      - name: Lint ratchet (eslint . vs .eslint-ratchet.json)
        run: npm run lint:ratchet

      # Dette de vulnérabilités préexistante dans l'arbre prod (3 high, 3 critical au
      # 2026-10-12, cf. docs/securite.md) : non bloquant jusqu'à résorption.
      - name: Audit (npm audit, prod scope)
        continue-on-error: true
        run: npm audit --omit=dev

  # --- JOB E2E (Q9) : Playwright sur les parcours critiques ---
  # Déclenché sur les PR uniquement : il bloque la fusion mais ne ralentit ni
  # n'expose le déploiement (deploy.yml appelle ce workflow en réutilisable ;
  # workflow_call n'a pas d'« event_name » pull_request, le job y est sauté).
  e2e:
    name: E2E (Playwright, parcours critiques)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.6.4

      - name: Install dependencies
        run: npm ci

      # Navigateur cache entre les PR (reprise tant que package-lock.json ne bouge pas).
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (playwright test)
        run: npx playwright test

      # Rapport HTML + traces/diff screenshots : utiles au premier échec seulement
      # (dialogues Radix et overlay annotorious produisent des snapshots d'accessibilité).
      - name: Upload E2E report (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
